name: test

on:

  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
      - name: set up maven
        uses: actions/setup-maven@v1
      - name: run the test
        run: |
          mvn clean test -Dsurefire.suiteXmlFiles=testng.xml
